# Times are stored in UTC using January's offset, as Rails does for time
# columns. Eastern Standard Time is UTC-5, so 14:00 ET is stored as 19:00.
today_afternoon:
  date: <%= Date.current + 1.day %>
  start_time: "19:00:00" # 2:00 PM ET
  end_time: "22:00:00" # 5:00 PM ET
  slot_duration_minutes: 30
  is_active: true
  title: "Coffee Chat"
  max_bookings_per_slot: 1

next_week:
  date: <%= Date.current + 7.days %>
  start_time: "14:00:00" # 9:00 AM ET
  end_time: "17:00:00" # 12:00 PM ET
  slot_duration_minutes: 60
  is_active: true
  max_bookings_per_slot: 2

inactive:
  date: <%= Date.current + 2.days %>
  start_time: "18:00:00" # 1:00 PM ET
  end_time: "19:00:00" # 2:00 PM ET
  slot_duration_minutes: 30
  is_active: false
  max_bookings_per_slot: 1
