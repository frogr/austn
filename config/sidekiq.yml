:verbose: false
:concurrency: 5
:timeout: 25

:queues:
  - [critical, 3]
  - [gpu, 3]  # GPU-intensive tasks (AI chat, image generation)
  - [default, 2]
  - [low, 1]
  - [mailers, 2]

:scheduler:
  :schedule:
    gpu_health_check:
      cron: '*/5 * * * *'  # Every 5 minutes; free when no GPU URL is configured
      class: GpuHealthCheckJob
      queue: default
      description: "Check GPU service health status"
    cleanup_expired_tts_shares:
      cron: '0 3 * * *'  # Daily at 3am
      class: CleanupExpiredTtsSharesJob
      queue: low
      description: "Delete expired TTS share links"
    low_availability_alert:
      cron: '0 9 * * * America/New_York'  # Daily at 9am Eastern
      class: LowAvailabilityAlertJob
      queue: default
      description: "Email Austin when few booking slots are open in the next 14 days"
    claude_corner_draft:
      cron: '0 10 1 * * America/New_York'  # 10am Eastern on the 1st of each month
      class: ClaudeCornerDraftJob
      queue: default
      description: "Ask Claude for a new Claude Corner draft"
    purge_stale_uploads:
      cron: '30 3 * * *'  # Daily at 3:30am
      class: PurgeStaleUploadsJob
      queue: low
      description: "Delete GPU tool uploads whose job never finished"

# GPU jobs can also run in a dedicated process (see Procfile.gpu). Either
# way, Gpu::Lock keeps it to one GPU job at a time across processes.

production:
  :concurrency: 10

development:
  :concurrency: 2